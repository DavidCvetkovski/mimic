name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Mimic's own logic is pure standard library and does not need the model,
    # so the suite runs anywhere Python does — no ONNX Runtime, no 968 MiB
    # download, no macOS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m compileall -q core tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet ruff
        # The vendored Audio8 sources are excluded: they are a verbatim copy,
        # and reformatting them would make re-syncing upstream painful.
      - run: ruff check core tests --exclude core/vendor

  swift:
    # The Swift half only builds on a Mac. This compiles all three targets —
    # the engine for macOS and for iOS, the Mac app, and the iPhone app. It
    # does not run them: the parity tests need the model, which is a gigabyte,
    # and they skip when it is absent.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The engine, for macOS
        run: swift build --package-path MimicKit

      - name: The engine, for iOS
        run: |
          xcodebuild -scheme MimicKit \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/dd build | tail -3

      - name: The Mac app
        run: |
          ./macos/build.sh
          test -x macos/build/Mimic.app/Contents/MacOS/Mimic
          test -f macos/build/Mimic.app/Contents/Resources/Mimic.icns
          codesign --verify --verbose macos/build/Mimic.app

      - name: The iPhone app
        run: |
          xcodebuild -project ios/Mimic.xcodeproj -scheme Mimic \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath /tmp/ios-dd build | tail -3

      - name: The Swift tests run (and skip cleanly without the model)
        run: swift test --package-path MimicKit 2>&1 | tail -5
