name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Mimic's own logic is pure standard library and does not need the model,
    # so the suite runs anywhere Python does — no ONNX Runtime, no 968 MiB
    # download, no macOS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m compileall -q core tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet ruff
        # The vendored Audio8 sources are excluded: they are a verbatim copy,
        # and reformatting them would make re-syncing upstream painful.
      - run: ruff check core tests --exclude core/vendor

  macos-app:
    # The Swift app only builds on a Mac, so it gets a runner of its own. This
    # compiles the bundle; it does not launch it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Mimic.app
        run: ./macos/build.sh
      - name: The bundle is complete
        run: |
          test -x macos/build/Mimic.app/Contents/MacOS/Mimic
          test -f macos/build/Mimic.app/Contents/Info.plist
          codesign --verify --verbose macos/build/Mimic.app
